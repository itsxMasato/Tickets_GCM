<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/Logo.png" />
    <link rel="apple-touch-icon" href="/img/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071D4C" />
    <title>GCM · Sistema de Tickets</title>
    
    <!-- Critical inline styles para evitar FOUC (Flash of Unstyled Content) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
      }
      #app {
        display: none; /* Ocultar hasta que CSS se cargue completamente */
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }
      #loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 3px solid #e2e8f0;
        border-top-color: #071d4c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-Bmhc5HrU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Di_rOj8m.css">
  </head>
  <body>
    <!-- Loading overlay que desaparece cuando app está lista -->
    <div id="loading-overlay">
      <div class="loader"></div>
    </div>
    
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>
    <noscript>
      <div style="padding:24px;max-width:560px;margin:48px auto;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#243447;background:#F7F9FC;border:1px solid #D6DEE8;border-radius:12px;">
        <h1 style="margin:0 0 8px;font-size:1.25rem;font-weight:700;color:#071D4C;">GCM Tickets requiere JavaScript habilitado.</h1>
        <p style="margin:0;font-size:0.875rem;line-height:1.5;">Este sistema no puede iniciarse sin JavaScript. Habilítelo en la configuración de su navegador o contacte a mesa de ayuda.</p>
      </div>
    </noscript>
    
    <!-- Script para mostrar app cuando CSS esté listo -->
    <script>
      // Fallback: mostrar app después de 3 segundos si main.js aún no ha mostrado
      let fallbackTimeout = setTimeout(() => {
        const app = document.getElementById('app');
        const overlay = document.getElementById('loading-overlay');
        if (app) app.style.display = 'block';
        if (overlay) overlay.classList.add('hidden');
      }, 3000);
      
      // main.js definirá esta función y limpiará el timeout
      window.clearShowTimeout = function() {
        clearTimeout(fallbackTimeout);
      };
    </script>
    
  </body>
</html>
