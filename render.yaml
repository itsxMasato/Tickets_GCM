# Render Blueprint — https://render.com/docs/blueprint-spec
# Sube este repo a render.com/new y detecta este archivo automáticamente.
# Variables de entorno:
#   - SESSION_SECRET: auto-generado por Render (generateValue: true).
#   - FIREBASE_SERVICE_ACCOUNT: pegar JSON del service account minificado
#     en el dashboard de Render (Environment → Add Secret File o env var).
#     El JSON no debe tener saltos de línea.
services:
  - type: web
    name: tickets-gcm-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node src/server.js
    # Sin healthCheckPath — Render no validará ningún endpoint al levantar.
    # El plan free de Render duerme el servicio tras 15 min sin tráfico
    # (cold start de 20-30s al primer request). El health check hace un GET
    # al levantarse y se queda sin tiempo antes de que Express termine de
    # inicializar Firebase Admin y conectar a Firestore, marcando el deploy
    # como "Timed Out" aunque el servicio sí esté corriendo (verificado en
    # logs: el server escucha correctamente, solo que después del timeout).
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: ticketsgcm
      - key: ALLOWED_ORIGIN
        value: https://ticketsgcm.netlify.app
      # FIREBASE_SERVICE_ACCOUNT se setea manualmente en el dashboard
      # (Sync: false evita que Render intente leerlo del blueprint).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
