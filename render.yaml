# Render Blueprint — https://render.com/docs/blueprint-spec
# Sube este repo a render.com/new y detecta este archivo automáticamente.
# Variables de entorno:
#   - SESSION_SECRET: auto-generado por Render (generateValue: true).
#   - FIREBASE_SERVICE_ACCOUNT: pegar JSON del service account minificado
#     en el dashboard de Render (Environment → Add Secret File o env var).
#     El JSON no debe tener saltos de línea.
services:
  - type: web
    name: tickets-gcm-api
    runtime: node
    # Los discos persistentes de Render requieren un plan pago (no "free").
    # Sin esto, `uploads/` (fotos de perfil, adjuntos de tickets) y las
    # sesiones se pierden en cada redeploy porque el filesystem del plan
    # free es efímero. Cambiar el plan implica un costo mensual — hacerlo
    # desde el dashboard de Render antes de que este blueprint tome efecto.
    plan: starter
    region: oregon
    branch: main
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node src/server.js
    disk:
      name: gcm-data
      mountPath: /data
      sizeGB: 1
    # Sin healthCheckPath — Render no validará ningún endpoint al levantar.
    # El health check hace un GET al levantarse y se queda sin tiempo antes
    # de que Express termine de inicializar Firebase Admin y conectar a
    # Firestore, marcando el deploy como "Timed Out" aunque el servicio sí
    # esté corriendo (verificado en logs). Esto no depende del plan.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: ticketsgcm
      - key: ALLOWED_ORIGIN
        value: https://ticketsgcm.netlify.app
      # Fotos de perfil y adjuntos de tickets viven en el disco persistente
      # montado en /data (ver `disk` arriba) — sin esto, se perderían en
      # cada redeploy igual que antes.
      - key: UPLOAD_DIR
        value: /data/uploads
      # Igual que UPLOAD_DIR: antes las sesiones vivían en /tmp/sessions
      # (también efímero) — ahora en el disco persistente.
      - key: SESSION_DIR
        value: /data/sessions
      # FIREBASE_SERVICE_ACCOUNT se setea manualmente en el dashboard
      # (Sync: false evita que Render intente leerlo del blueprint).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
