# Render Blueprint — https://render.com/docs/blueprint-spec
# Sube este repo a render.com/new y detecta este archivo automáticamente.
# Variables de entorno:
#   - SESSION_SECRET: auto-generado por Render (generateValue: true).
#   - MSSQL_HOST / MSSQL_PORT / MSSQL_DATABASE / MSSQL_USER / MSSQL_PASSWORD:
#     credenciales del SQL Server de producción, se setean manualmente en el
#     dashboard de Render (Environment → Add Environment Variable). Ver
#     src/orm/env.js para el resto de las variables MSSQL_* opcionales.
services:
  - type: web
    name: tickets-gcm-api
    runtime: node
    # Los discos persistentes de Render requieren un plan pago (no "free").
    # Sin esto, `uploads/` (fotos de perfil, adjuntos de tickets) y las
    # sesiones se pierden en cada redeploy porque el filesystem del plan
    # free es efímero. Cambiar el plan implica un costo mensual — hacerlo
    # desde el dashboard de Render antes de que este blueprint tome efecto.
    plan: starter
    region: oregon
    branch: main
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node src/server.js
    disk:
      name: gcm-data
      mountPath: /data
      sizeGB: 1
    # Sin healthCheckPath — Render no validará ningún endpoint al levantar.
    # El health check hace un GET al levantarse y se queda sin tiempo antes
    # de que Express termine de conectar al ORM (SQL Server), marcando el
    # deploy como "Timed Out" aunque el servicio sí esté corriendo (verificado
    # en logs con el setup anterior). Esto no depende del plan.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://tickets-gcm-api.onrender.com
      # Fotos de perfil y adjuntos de tickets viven en el disco persistente
      # montado en /data (ver `disk` arriba) — sin esto, se perderían en
      # cada redeploy igual que antes.
      - key: UPLOAD_DIR
        value: /data/uploads
      # Igual que UPLOAD_DIR: antes las sesiones vivían en /tmp/sessions
      # (también efímero) — ahora en el disco persistente.
      - key: SESSION_DIR
        value: /data/sessions
      # Credenciales de SQL Server: se setean manualmente en el dashboard
      # (sync: false evita que Render intente leerlas del blueprint).
      - key: MSSQL_HOST
        sync: false
      - key: MSSQL_PORT
        sync: false
      - key: MSSQL_DATABASE
        sync: false
      - key: MSSQL_USER
        sync: false
      - key: MSSQL_PASSWORD
        sync: false
